name: Build Windows binaries

# NVIDIA builds OpenShell's native Windows binaries in CI but never uploads them,
# and the `windows` branch has no releases. This workflow rebuilds them on
# GitHub-hosted runners and attaches one portable x64 zip per upstream commit.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build
  cancel-in-progress: false

env:
  UPSTREAM_REPO: NVIDIA/OpenShell
  UPSTREAM_REF: windows
  ASSET: openshell-windows-x64.zip

jobs:
  prepare:
    name: Resolve upstream commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      tag: ${{ steps.meta.outputs.tag }}
      skip: ${{ steps.meta.outputs.skip }}
    steps:
      - name: Compute release tag
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Blobless clone: only history and tags are needed, to find the
          # stable tag the branch descends from.
          git clone --filter=blob:none --no-checkout --quiet "https://github.com/$UPSTREAM_REPO.git" upstream
          sha=$(git -C upstream rev-parse "origin/$UPSTREAM_REF")
          stamp=$(git -C upstream log -1 --format=%cd --date=format:%Y%m%d "$sha")
          # Same base rule as crates/openshell-core/build.rs: highest stable tag
          # merged into the commit, then bump the patch, so the version never
          # claims a tag that already exists. Versions live in the tags, not in
          # the tree (Cargo.toml is 0.0.0 everywhere), and this branch is outside
          # the release train.
          base=$(git -C upstream tag --merged "$sha" --list 'v*.*.*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^v//' \
            | sort -t. -k1,1n -k2,2n -k3,3n \
            | tail -1)
          test -n "$base" || { echo "no stable tag is reachable from $sha"; exit 1; }
          short=$(git -C upstream rev-parse --short=9 "$sha")
          IFS=. read -r major minor patch <<< "$base"
          # `pre` is upstream's own prerelease marker (`v0.1.0-pre.1`), and a
          # prerelease sorts below the release it leads to; the date keeps the
          # builds ordered without relying on distance from the tag.
          tag="$major.$minor.$((patch + 1))-pre.$stamp.$short"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$tag already released, nothing to build."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Building $tag from $sha."
          fi

  build:
    name: Build windows-x64
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      READ_ONLY_GITHUB_TOKEN: ${{ github.token }}
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: openshell-windows-x64
      SCCACHE_CLIENT_SIDE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
          fetch-depth: 1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: false
          experimental: true
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Install Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install
          rustup target add x86_64-pc-windows-msvc
      - name: Stamp version
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.tag }}
        run: |
          # Same stamp as upstream: workspace crates inherit this version, so
          # `--version` reports the release tag instead of a git-derived guess.
          sed -i 's/^version = "0\.0\.0"/version = "'"$VERSION"'"/' Cargo.toml
          grep -qF "version = \"$VERSION\"" Cargo.toml
      - name: Build release binaries
        env:
          # Hides the checkout from openshell-core/build.rs, which would
          # otherwise derive a version from the shallow clone's history and win
          # over the stamped one.
          GIT_DIR: C:\nonexistent
        run: mise run --skip-tools windows:build:x64
      - name: Smoke test
        env:
          VERSION: ${{ needs.prepare.outputs.tag }}
        run: |
          $reported = ./target/x86_64-pc-windows-msvc/release/openshell.exe --version
          Write-Host $reported
          if ($reported -ne "openshell $env:VERSION") {
            throw "unexpected version: $reported"
          }
      - name: Package
        run: |
          $release = "target/x86_64-pc-windows-msvc/release"
          New-Item -ItemType Directory -Force package | Out-Null
          $binaries = "openshell.exe", "openshell-gateway.exe", "openshell-supervisor.exe", "openshell-windows-sandbox.exe", "libz3.dll"
          foreach ($file in $binaries) {
            Copy-Item -LiteralPath (Join-Path $release $file) -Destination package -ErrorAction Stop
          }
          Copy-Item -LiteralPath LICENSE, THIRD-PARTY-NOTICES -Destination package -ErrorAction Stop
          Compress-Archive -Path package/* -DestinationPath $env:ASSET
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: openshell-windows-x64.zip
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          printf '%s\n' \
            "Unofficial x64 build of [$UPSTREAM_REPO@$SHA](https://github.com/$UPSTREAM_REPO/commit/$SHA) ([\`$UPSTREAM_REF\` branch](https://github.com/$UPSTREAM_REPO/tree/$UPSTREAM_REF))." \
            "Not built, qualified, or signed by NVIDIA; the native Windows backend is under development and not production-qualified." \
            > notes.md
          gh release create "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" \
            --title "OpenShell Windows $TAG" \
            --notes-file notes.md
